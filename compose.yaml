services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      ALLOW_NONLOCAL_OLLAMA: "1"
      ZODERISE_KEEP_ALIVE: 3m
      ZODERISE_ENABLE_REGISTRATION: "0"
      ZODERISE_REQUIRE_ADMIN_APPROVAL: "1"
      ZODERISE_DB: /app/data/zoderise.db
      ZODERISE_STORAGE: /app/data/storage
      SERVER_HOST: 0.0.0.0
    volumes:
      - app-data:/app/data
    depends_on:
      - ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
      - ./Modelfile:/models/Modelfile:ro
      - ./Modelfile-vision:/models/Modelfile-vision:ro
volumes:
  app-data:
  ollama-models:
